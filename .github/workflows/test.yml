name: Jest unit tests

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: jest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jest:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      CI: true
    steps:
      - name: Checkout
        # v4
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Setup Node
        # v4
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version-file: .nvmrc

      - name: Run npm install
        uses: nick-fields/retry@3f757583fb1b1f940bc8ef4bf4734c8dc02a5847
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: npm ci

      - name: Run Jest tests
        run: npm run test

      - name: Run oxlint tests
        run: npm run test:oxlint

  # Warns when a new oxlint release breaks the oxlint config. It does not block: the pinned versions in package.json are
  # the gate above. `.npmrc` min-release-age applies here too, so `latest` is the newest version at least 7 days old.
  oxlint-latest:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    continue-on-error: true
    env:
      CI: true
    steps:
      - name: Checkout
        # v4
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Setup Node
        # v4
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version-file: .nvmrc

      - name: Run npm install
        uses: nick-fields/retry@3f757583fb1b1f940bc8ef4bf4734c8dc02a5847
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: npm ci

      - name: Install the latest oxlint
        run: npm install --no-save oxlint@latest @oxlint/migrate@latest oxlint-tsgolint@latest

      - name: Run oxlint tests
        run: npm run test:oxlint
